<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 180" fill="none">
  <defs>
    <radialGradient id="jellyGrad" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#FCE7F3"/>
      <stop offset="70%" stop-color="#F472B6"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </radialGradient>
    <filter id="jellyGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <g filter="url(#jellyGlow)">
    <!-- Jellyfish Tentacles -->
    <path d="M50 95 Q42 120 54 145 T48 170" stroke="#F472B6" stroke-width="4" stroke-linecap="round" fill="none"/>
    <path d="M70 100 Q62 125 76 150 T68 175" stroke="#EC4899" stroke-width="4.5" stroke-linecap="round" fill="none"/>
    <path d="M90 100 Q98 125 84 150 T92 175" stroke="#EC4899" stroke-width="4.5" stroke-linecap="round" fill="none"/>
    <path d="M110 95 Q118 120 106 145 T112 170" stroke="#F472B6" stroke-width="4" stroke-linecap="round" fill="none"/>
    
    <!-- Jellyfish Bell / Mushroom Cap -->
    <path d="M30 85 C30 35, 130 35, 130 85 C130 96, 120 100, 108 96 C98 92, 92 100, 80 97 C68 94, 62 100, 52 96 C40 100, 30 96, 30 85 Z" fill="url(#jellyGrad)" stroke="#DB2777" stroke-width="2.5"/>
    
    <!-- Spots / dots on bell -->
    <ellipse cx="65" cy="55" rx="7" ry="5" fill="#BE185D" opacity="0.4"/>
    <ellipse cx="95" cy="52" rx="8" ry="6" fill="#BE185D" opacity="0.4"/>
    <ellipse cx="80" cy="42" rx="6" ry="4" fill="#BE185D" opacity="0.4"/>
    <ellipse cx="50" cy="70" rx="5" ry="4" fill="#BE185D" opacity="0.3"/>
    <ellipse cx="110" cy="68" rx="6" ry="4" fill="#BE185D" opacity="0.3"/>

    <!-- Cute Eyes -->
    <circle cx="68" cy="74" r="5" fill="#1F2937"/>
    <circle cx="70" cy="72" r="2" fill="#FFFFFF"/>
    <circle cx="92" cy="74" r="5" fill="#1F2937"/>
    <circle cx="94" cy="72" r="2" fill="#FFFFFF"/>

    <!-- Blush -->
    <ellipse cx="58" cy="80" rx="4" ry="2.5" fill="#BE185D" opacity="0.5"/>
    <ellipse cx="102" cy="80" rx="4" ry="2.5" fill="#BE185D" opacity="0.5"/>

    <!-- Smile -->
    <path d="M76 80 Q80 85 84 80" stroke="#1F2937" stroke-width="2" stroke-linecap="round" fill="none"/>

    <!-- Sparkles -->
    <path d="M22 45 L25 50 L30 52 L25 54 L22 59 L19 54 L14 52 L19 50 Z" fill="#FDE047"/>
    <path d="M136 32 L138 36 L142 38 L138 40 L136 44 L134 40 L130 38 L134 36 Z" fill="#FDE047"/>
  </g>
</svg>
