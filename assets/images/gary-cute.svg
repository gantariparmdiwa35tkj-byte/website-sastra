<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 140" fill="none">
  <defs>
    <filter id="garyShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#DB2777" flood-opacity="0.15"/>
    </filter>
  </defs>
  <g filter="url(#garyShadow)">
    <!-- Gary Shell (Pink with purple spiral and five purple dots) -->
    <circle cx="95" cy="65" r="40" fill="#F472B6" stroke="#333" stroke-width="3"/>
    <!-- Shell Spiral -->
    <path d="M95 65 m-22 0 a22 22 0 1 0 44 0 a14 14 0 1 0 -28 0 a6 6 0 1 0 12 0" fill="none" stroke="#7E22CE" stroke-width="3.5" stroke-linecap="round"/>
    <!-- 5 Purple Dots on Shell -->
    <circle cx="75" cy="50" r="4.5" fill="#7E22CE"/>
    <circle cx="115" cy="45" r="4.5" fill="#7E22CE"/>
    <circle cx="125" cy="75" r="4.5" fill="#7E22CE"/>
    <circle cx="100" cy="95" r="4.5" fill="#7E22CE"/>
    <circle cx="68" cy="80" r="4.5" fill="#7E22CE"/>

    <!-- Slime Body (Light Teal/Cyan) -->
    <path d="M25 105 C25 90, 50 90, 65 92 C80 92, 120 95, 145 102 C150 105, 145 118, 135 118 C100 118, 40 118, 25 118 C18 118, 18 105, 25 105 Z" fill="#67E8F9" stroke="#333" stroke-width="3"/>

    <!-- Eyestalks -->
    <path d="M42 94 L32 40" stroke="#67E8F9" stroke-width="7" stroke-linecap="round"/>
    <path d="M42 94 L32 40" stroke="#333" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M52 94 L56 36" stroke="#67E8F9" stroke-width="7" stroke-linecap="round"/>
    <path d="M52 94 L56 36" stroke="#333" stroke-width="3" stroke-linecap="round" fill="none"/>

    <!-- Eyes (Big red & blue) -->
    <!-- Left Eye -->
    <circle cx="30" cy="35" r="14" fill="#FFFFFF" stroke="#333" stroke-width="2.5"/>
    <circle cx="30" cy="35" r="7" fill="#EF4444"/>
    <circle cx="30" cy="35" r="3.5" fill="#1E3A8A"/>
    <circle cx="32" cy="33" r="2" fill="#FFFFFF"/>

    <!-- Right Eye -->
    <circle cx="58" cy="32" r="14" fill="#FFFFFF" stroke="#333" stroke-width="2.5"/>
    <circle cx="58" cy="32" r="7" fill="#EF4444"/>
    <circle cx="58" cy="32" r="3.5" fill="#1E3A8A"/>
    <circle cx="60" cy="30" r="2" fill="#FFFFFF"/>

    <!-- Cute smile and meow quote bubble -->
    <path d="M24 108 Q28 112 32 108" stroke="#333" stroke-width="2" stroke-linecap="round" fill="none"/>
  </g>
</svg>
