<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 280" fill="none">
  <defs>
    <filter id="cuteShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#F59E0B" flood-opacity="0.2"/>
    </filter>
  </defs>
  <g filter="url(#cuteShadow)">
    <!-- Legs -->
    <rect x="90" y="215" width="10" height="25" fill="#FFEAA7" stroke="#333" stroke-width="2.5" rx="4"/>
    <rect x="140" y="215" width="10" height="25" fill="#FFEAA7" stroke="#333" stroke-width="2.5" rx="4"/>
    <!-- Socks -->
    <rect x="88" y="228" width="14" height="12" fill="#FFFFFF" stroke="#333" stroke-width="2"/>
    <line x1="88" y1="232" x2="102" y2="232" stroke="#EF4444" stroke-width="1.5"/>
    <line x1="88" y1="235" x2="102" y2="235" stroke="#3B82F6" stroke-width="1.5"/>
    <rect x="138" y="228" width="14" height="12" fill="#FFFFFF" stroke="#333" stroke-width="2"/>
    <line x1="138" y1="232" x2="152" y2="232" stroke="#EF4444" stroke-width="1.5"/>
    <line x1="138" y1="235" x2="152" y2="235" stroke="#3B82F6" stroke-width="1.5"/>
    <!-- Shoes -->
    <ellipse cx="92" cy="244" rx="12" ry="7" fill="#1F2937" stroke="#111" stroke-width="2"/>
    <ellipse cx="148" cy="244" rx="12" ry="7" fill="#1F2937" stroke="#111" stroke-width="2"/>
    
    <!-- Pants (Brown) -->
    <path d="M70 185 H170 V215 H145 V208 H95 V215 H70 Z" fill="#B45309" stroke="#333" stroke-width="3" stroke-linejoin="round"/>
    <rect x="76" y="193" width="12" height="4" rx="2" fill="#111"/>
    <rect x="104" y="193" width="12" height="4" rx="2" fill="#111"/>
    <rect x="124" y="193" width="12" height="4" rx="2" fill="#111"/>
    <rect x="152" y="193" width="12" height="4" rx="2" fill="#111"/>

    <!-- Shirt (White) -->
    <path d="M70 162 H170 V187 H70 Z" fill="#FFFFFF" stroke="#333" stroke-width="3"/>
    <!-- Collar -->
    <polygon points="100,163 112,175 120,163" fill="#FFFFFF" stroke="#333" stroke-width="2"/>
    <polygon points="140,163 128,175 120,163" fill="#FFFFFF" stroke="#333" stroke-width="2"/>
    <!-- Red Tie -->
    <polygon points="117,166 123,166 125,174 120,188 115,174" fill="#EF4444" stroke="#333" stroke-width="2"/>

    <!-- Body (Cute Sponge Yellow) -->
    <rect x="65" y="45" width="110" height="120" rx="16" fill="#FDE047" stroke="#333" stroke-width="3.5"/>
    
    <!-- Sponge pores (Soft olive/greenish yellow circles) -->
    <circle cx="82" cy="65" r="7" fill="#EAB308" opacity="0.45"/>
    <circle cx="158" cy="70" r="8" fill="#EAB308" opacity="0.45"/>
    <circle cx="75" cy="140" r="6" fill="#EAB308" opacity="0.45"/>
    <circle cx="155" cy="145" r="7" fill="#EAB308" opacity="0.45"/>
    <circle cx="95" cy="53" r="4" fill="#EAB308" opacity="0.45"/>
    <circle cx="140" cy="55" r="5" fill="#EAB308" opacity="0.45"/>

    <!-- Left Arm waving -->
    <path d="M66 140 Q40 120 32 95 Q30 90 38 88 Q48 95 52 110" fill="#FDE047" stroke="#333" stroke-width="3" stroke-linecap="round"/>
    <!-- Left Hand Wave -->
    <circle cx="34" cy="90" r="9" fill="#FDE047" stroke="#333" stroke-width="2.5"/>
    <!-- Sleeve Left -->
    <path d="M60 135 Q65 148 70 148" stroke="#333" stroke-width="3"/>
    <ellipse cx="64" cy="142" rx="6" ry="8" fill="#FFFFFF" stroke="#333" stroke-width="2.5"/>

    <!-- Right Arm relaxed/hip -->
    <path d="M174 140 Q192 145 198 160 Q200 168 190 170 Q180 165 174 152" fill="#FDE047" stroke="#333" stroke-width="3" stroke-linecap="round"/>
    <!-- Sleeve Right -->
    <ellipse cx="176" cy="142" rx="6" ry="8" fill="#FFFFFF" stroke="#333" stroke-width="2.5"/>

    <!-- Big Cute Blue Eyes -->
    <!-- Eye Left -->
    <circle cx="102" cy="95" r="19" fill="#FFFFFF" stroke="#333" stroke-width="3"/>
    <circle cx="104" cy="95" r="10" fill="#38BDF8" stroke="#333" stroke-width="1.5"/>
    <circle cx="105" cy="95" r="5" fill="#1F2937"/>
    <circle cx="108" cy="91" r="3" fill="#FFFFFF"/>
    <!-- Eyelashes Left -->
    <line x1="93" y1="74" x2="91" y2="67" stroke="#333" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="102" y1="73" x2="102" y2="65" stroke="#333" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="111" y1="74" x2="114" y2="67" stroke="#333" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Eye Right -->
    <circle cx="138" cy="95" r="19" fill="#FFFFFF" stroke="#333" stroke-width="3"/>
    <circle cx="136" cy="95" r="10" fill="#38BDF8" stroke="#333" stroke-width="1.5"/>
    <circle cx="135" cy="95" r="5" fill="#1F2937"/>
    <circle cx="138" cy="91" r="3" fill="#FFFFFF"/>
    <!-- Eyelashes Right -->
    <line x1="129" y1="74" x2="127" y2="67" stroke="#333" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="138" y1="73" x2="138" y2="65" stroke="#333" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="147" y1="74" x2="150" y2="67" stroke="#333" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Cute Nose -->
    <ellipse cx="120" cy="107" rx="5" ry="9" fill="#FDE047" stroke="#333" stroke-width="2.5"/>

    <!-- Blushing Cute Cheeks with 3 Freckles -->
    <circle cx="83" cy="115" r="10" fill="#F472B6" opacity="0.6"/>
    <circle cx="80" cy="113" r="1.5" fill="#B91C1C"/>
    <circle cx="85" cy="112" r="1.5" fill="#B91C1C"/>
    <circle cx="83" cy="117" r="1.5" fill="#B91C1C"/>

    <circle cx="157" cy="115" r="10" fill="#F472B6" opacity="0.6"/>
    <circle cx="154" cy="113" r="1.5" fill="#B91C1C"/>
    <circle cx="159" cy="112" r="1.5" fill="#B91C1C"/>
    <circle cx="157" cy="117" r="1.5" fill="#B91C1C"/>

    <!-- Wide Happy Smile -->
    <path d="M85 116 Q120 152 155 116" stroke="#333" stroke-width="3" fill="#B91C1C"/>
    <!-- Two Cute Gap Teeth -->
    <rect x="110" y="125" width="8" height="9" fill="#FFFFFF" stroke="#333" stroke-width="2" rx="1"/>
    <rect x="122" y="125" width="8" height="9" fill="#FFFFFF" stroke="#333" stroke-width="2" rx="1"/>
    <!-- Dimples -->
    <path d="M82 112 Q81 116 86 119" stroke="#333" stroke-width="2" fill="none"/>
    <path d="M158 112 Q159 116 154 119" stroke="#333" stroke-width="2" fill="none"/>
  </g>
</svg>
